<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Big Photo with Single Orbit</title>
  <style>
    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #circle-orbit-container {
      position: relative;
      width: 600px;  /* bigger container */
      height: 600px;
    }

    #center-photo {
      position: absolute;
      top: 50px;    /* center the photo inside container */
      left: 50px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 5px solid #4A437F;
      object-fit: cover;
      z-index: 2;
    }

    #inner-orbit {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 600px;
      height: 600px;
      border: 3px dashed #4A437F;
      border-radius: 50%;
      animation: spin-right 15s linear infinite;
    }

    .orbit-dot {
      position: absolute;
      top: 0;
      left: 295px; /* center horizontally on orbit */
      width: 15px;
      height: 15px;
      background-color: #9F98E6;
      border-radius: 50%;
    }

    @keyframes spin-right {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div id="circle-orbit-container">
    <!-- Replace with your photo -->
    <img src="./photos/pf.png" id="center-photo" alt="Center Photo">

    <div id="inner-orbit">
      <div class="orbit-dot"></div>
    </div>
  </div>

</body>
</html>
